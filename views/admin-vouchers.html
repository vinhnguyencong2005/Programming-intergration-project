<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Voucher - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h4><i class="fas fa-motorcycle me-2"></i>Admin Panel</h4>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin/dashboard" class="nav-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Thống Kê Doanh Thu</span>
                </a>
                <a href="/admin/inventory" class="nav-item">
                    <i class="fas fa-warehouse"></i>
                    <span>Quản Lý Tồn Kho</span>
                </a>
                <a href="/admin/customers" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Quản Lý Khách Hàng</span>
                </a>
                <a href="/admin/vouchers" class="nav-item active">
                    <i class="fas fa-ticket-alt"></i>
                    <span>Quản Lý Voucher</span>
                </a>
                <a href="/admin/reports" class="nav-item">
                    <i class="fas fa-flag"></i>
                    <span>Báo Cáo & Đánh Giá</span>
                </a>
                <div class="nav-divider"></div>
                <a href="/" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Về Trang Chủ</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <div class="admin-header">
                <h2>Quản Lý Voucher</h2>
                <div class="d-flex gap-3 align-items-center">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addVoucherModal">
                        <i class="fas fa-plus me-2"></i>Thêm Voucher
                    </button>
                    <div class="admin-profile">
                        <i class="fas fa-user-circle"></i>
                        <span class="admin-name">Admin</span>
                        <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                            <i class="fas fa-sign-out-alt me-1"></i>Đăng Xuất
                        </button>
                    </div>
                </div>
            </div>

            <div class="admin-content">
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Mã Voucher</th>
                                        <th>Giảm Giá</th>
                                        <th>Ngày Bắt Đầu</th>
                                        <th>Ngày Kết Thúc</th>
                                        <th>Số Lượng</th>
                                        <th>Đơn Tối Thiểu</th>
                                        <th>Trạng Thái</th>
                                        <th>Thao Tác</th>
                                    </tr>
                                </thead>
                                <tbody id="vouchersTable">
                                    <tr>
                                        <td colspan="8" class="text-center">Đang tải...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Voucher Modal -->
    <div class="modal fade" id="addVoucherModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Thêm Voucher Mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addVoucherForm">
                        <div class="mb-3">
                            <label for="addCode" class="form-label">Mã Voucher *</label>
                            <input type="text" class="form-control" id="addCode" required>
                        </div>
                        <div class="mb-3">
                            <label for="addReduction" class="form-label">Giảm Giá (₫) *</label>
                            <input type="number" class="form-control" id="addReduction" min="0" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="addStartDate" class="form-label">Ngày Bắt Đầu *</label>
                                <input type="date" class="form-control" id="addStartDate" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="addEndDate" class="form-label">Ngày Kết Thúc *</label>
                                <input type="date" class="form-control" id="addEndDate" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="addQuantity" class="form-label">Số Lượng *</label>
                            <input type="number" class="form-control" id="addQuantity" min="1" required>
                        </div>
                        <div class="mb-3">
                            <label for="addConditions" class="form-label">Đơn Hàng Tối Thiểu (₫) *</label>
                            <input type="number" class="form-control" id="addConditions" min="0" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="addVoucher()">Thêm</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Voucher Modal -->
    <div class="modal fade" id="editVoucherModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Chỉnh Sửa Voucher</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editVoucherForm">
                        <input type="hidden" id="editCode">
                        <div class="mb-3">
                            <label class="form-label">Mã Voucher</label>
                            <input type="text" class="form-control" id="editCodeDisplay" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="editReduction" class="form-label">Giảm Giá (₫) *</label>
                            <input type="number" class="form-control" id="editReduction" min="0" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="editStartDate" class="form-label">Ngày Bắt Đầu *</label>
                                <input type="date" class="form-control" id="editStartDate" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="editEndDate" class="form-label">Ngày Kết Thúc *</label>
                                <input type="date" class="form-control" id="editEndDate" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="editQuantity" class="form-label">Số Lượng *</label>
                            <input type="number" class="form-control" id="editQuantity" min="1" required>
                        </div>
                        <div class="mb-3">
                            <label for="editConditions" class="form-label">Đơn Hàng Tối Thiểu (₫) *</label>
                            <input type="number" class="form-control" id="editConditions" min="0" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="updateVoucher()">Lưu</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/admin-vouchers.js"></script>
</body>
</html>
