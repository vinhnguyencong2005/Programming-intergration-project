<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Khách Hàng - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h4><i class="fas fa-motorcycle me-2"></i>Admin Panel</h4>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin/dashboard" class="nav-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Thống Kê Doanh Thu</span>
                </a>
                <a href="/admin/inventory" class="nav-item">
                    <i class="fas fa-warehouse"></i>
                    <span>Quản Lý Tồn Kho</span>
                </a>
                <a href="/admin/customers" class="nav-item active">
                    <i class="fas fa-users"></i>
                    <span>Quản Lý Khách Hàng</span>
                </a>
                <a href="/admin/vouchers" class="nav-item">
                    <i class="fas fa-ticket-alt"></i>
                    <span>Quản Lý Voucher</span>
                </a>
                <a href="/admin/reports" class="nav-item">
                    <i class="fas fa-flag"></i>
                    <span>Báo Cáo & Đánh Giá</span>
                </a>
                <div class="nav-divider"></div>
                <a href="/" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Về Trang Chủ</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <div class="admin-header">
                <h2>Quản Lý Khách Hàng</h2>
                <div class="d-flex gap-3 align-items-center">
                    <div class="search-box">
                        <input type="text" id="searchInput" class="form-control" placeholder="Tìm kiếm khách hàng...">
                        <i class="fas fa-search"></i>
                    </div>
                    <div class="admin-profile">
                        <i class="fas fa-user-circle"></i>
                        <span class="admin-name">Admin</span>
                        <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                            <i class="fas fa-sign-out-alt me-1"></i>Đăng Xuất
                        </button>
                    </div>
                </div>
            </div>

            <div class="admin-content">
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Tên Đăng Nhập</th>
                                        <th>Họ Tên</th>
                                        <th>Số Điện Thoại</th>
                                        <th>Email</th>
                                        <th>Địa Chỉ</th>
                                        <th>Tổng Đơn</th>
                                        <th>Tổng Chi Tiêu</th>
                                        <th>Ngày Tạo</th>
                                    </tr>
                                </thead>
                                <tbody id="customersTable">
                                    <tr>
                                        <td colspan="9" class="text-center">Đang tải...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/admin-customers.js"></script>
</body>
</html>
